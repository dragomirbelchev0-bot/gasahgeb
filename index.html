<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duel — ID Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#080D24; --card:#202747; --field:#111831; --accent:#4855FF; --white:#fff; --muted:#7789D0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Mulish", sans-serif; background: var(--bg); color: var(--white); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .card { background: var(--card); border-radius: 12px; padding: 32px; width: 100%; max-width: 480px; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .id-box { background: var(--field); border-radius: 9px; padding: 20px; font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-bottom: 20px; color: var(--accent); }
  .btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 15px; font-size: 15px; font-weight: 700; border-radius: 9px; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
  .btn:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; border: 1px solid var(--muted); color: var(--muted); }
  .btn-ghost:hover { color: #fff; border-color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Partner ID Generator</h1>
    <p>Generate a new ID.</p>
    <div class="id-box" id="display">---</div>
    <button class="btn" onclick="generate()">Generate ID</button>
    <button class="btn btn-ghost" onclick="copyID()">Copy to Clipboard</button>
  </div>

<script>
  function generate() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let id = 'DUEL-';
    for(let i=0; i<8; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
    document.getElementById('display').textContent = id;
  }

  function copyID() {
    const text = document.getElementById('display').textContent;
    if(text === '---') return;
    navigator.clipboard.writeText(text).then(() => alert('Copied: ' + text));
  }
</script>
</body>
</html>
